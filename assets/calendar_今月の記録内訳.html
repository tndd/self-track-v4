</style></head><body>
<header><h1>「今月の記録内訳」コンポーネントのみ — 50案</h1><p>共通データ：30日間／Lv.1 = 4日・Lv.2 = 6日・Lv.3 = 9日・Lv.4 = 7日・Lv.5 = 4日／月平均 3.1。日数と割合を必ず併記。カレンダーや下部グラフは含めない、コンポーネント単体の比較用です。</p></header>
<main class="grid" id="app"></main>
<script>
const C=['c1','c2','c3','c4','c5'],N=[4,6,9,7,4],P=[13,20,30,23,14];
const stack=()=>`<div class="stack">${C.map((c,i)=>`<span class="${c}" style="width:${P[i]}%"></span>`).join('')}</div>`;
const legend=()=>`<div class="legend">${C.map((c,i)=>`<span><i class="${c}"></i><b>${N[i]}日</b> ${P[i]}%</span>`).join('')}</div>`;
const rows=()=>`<div class="rows">${C.map((c,i)=>`<div class="row"><span>● Lv.${i+1}</span><div class="track"><div class="fill ${c}" style="width:${P[i]*3.15}%"></div></div><b>${N[i]}日</b></div>`).join('')}</div>`;
const dots=(square=false)=>`<div class="dotgrid ${square?'squares':''}">${C.flatMap((c,i)=>Array(N[i]).fill(`<i class="${c}"></i>`)).join('')}</div>`;
const facts=()=>`<div class="facts">${C.map((c,i)=>`<span><i class="${c}"></i>Lv.${i+1} <b>${N[i]}日</b> ${P[i]}%</span>`).join('')}</div>`;
const title=(name,note,html,i)=>`<section class="case"><h2><span>${i+1}</span>${name}</h2><p class="note">${note}</p><div class="component"><span class="chip">今月の記録内訳</span>${html}${facts()}</div></section>`;
const V=[
['横積み棒','最も省スペース。割合の全体像をすばやく読む標準案。',`${stack()}<div class="barlabels"><span>不調</span><b>30日間</b><span>好調</span></div>${legend()}`],
['横棒ランキング','各レベルの日数差を正確に比較するならこの形。',rows()],
['上半円メーター','円の印象を残しながら、ドーナツより縦幅を抑える。中央の平均値は幾何学的な中心に固定。',`<div style="position:relative;width:160px;height:77px;margin:auto"><svg style="position:absolute;inset:0;width:160px;height:82px" viewBox="0 0 160 82"><path d="M15 74 A67 67 0 0 1 35 29" fill="none" stroke="#ef4444" stroke-width="14"/><path d="M35 29 A67 67 0 0 1 79 7" fill="none" stroke="#f97316" stroke-width="14"/><path d="M79 7 A67 67 0 0 1 130 29" fill="none" stroke="#94a3b8" stroke-width="14"/><path d="M130 29 A67 67 0 0 1 145 74" fill="none" stroke="#22c55e" stroke-width="14"/></svg><div style="position:absolute;top:34px;left:0;width:160px;text-align:center;line-height:1"><b style="font-size:19px;color:#475569">3.1</b><br><span class="muted">今月平均</span></div></div>`],
['平均値＋分布ブロック','平均を主役にし、残りを棒の分布で添える。',`<div class="split"><div class="tile"><b class="big">3.1</b><span class="muted">今月平均</span></div><div class="blocks">${C.map((c,i)=>`<span class="${c}" style="height:${N[i]*6}px"></span>`).join('')}</div></div><div class="barlabels"><span>Lv.1</span><span>Lv.2</span><span>Lv.3</span><span>Lv.4</span><span>Lv.5</span></div>`],
['30日タイムライン','割合と日付方向の偏りを同時に感じられる。',`<div class="timeline">${Array.from({length:30},(_,i)=>`<i class="${C[(i*7+i%4)%5]}"></i>`).join('')}</div><div class="barlabels"><span>6/1</span><b>1マス = 1日</b><span>6/30</span></div>${legend()}`],
['5段階ヒストグラム','分布の山の位置を、数字を読まずに認識できる。',`<div class="split"><div class="blocks" style="gap:8px">${C.map((c,i)=>`<span class="${c}" style="height:${N[i]*6}px"></span>`).join('')}</div><div class="small">最多<br><b class="big" style="font-size:18px">Lv.3</b><br>9日</div></div><div class="barlabels"><span>Lv.1</span><span>Lv.2</span><span>Lv.3</span><span>Lv.4</span><span>Lv.5</span></div>`],
['二極バー','標準（Lv.3）に対し、不調・好調のどちらに寄ったかを強調。',`<div class="area">${C.map((c,i)=>`<span class="${c}" style="height:${N[i]*6}px;align-self:${i<2?'end':i===2?'center':'start'}"></span>`).join('')}</div><div class="barlabels"><span>不調 ←</span><b>標準 9日</b><span>→ 好調</span></div>`],
['カード型サマリー','意思決定に使う3つの数値を最初に読ませる。',`<div class="metricGrid"><div class="metric"><b>3.1</b><span>平均</span></div><div class="metric"><b>9日</b><span>最多 Lv.3</span></div><div class="metric"><b>11日</b><span>好調日</span></div></div><div style="margin-top:9px">${stack()}</div>`],
['ドット・マトリクス','30日を30個の点で表す。量を直感的に把握しやすい。',`${dots()}<div class="callout">全 <b>30日</b> ／ 最多は <b>Lv.3（9日）</b></div>`],
['レンジ・スケール','平均位置を5段階の連続した尺度上に示す。',`<div class="scale"><div class="pointer">平均 3.1</div>${stack()}</div><div class="barlabels"><span>Lv.1・4日</span><span>Lv.2・6日</span><span>Lv.3・9日</span><span>Lv.4・7日</span><span>Lv.5・4日</span></div>`],
['面積比較','数字より面積の印象で、日数の差を捉える。',`<div style="display:flex;gap:4px;height:63px">${C.map((c,i)=>`<div class="${c}" style="flex:${N[i]};border-radius:7px;color:${i===2?'#334155':'#fff'};display:flex;align-items:center;justify-content:center;flex-direction:column"><b style="font-size:15px">${N[i]}</b><span class="small" style="color:inherit">Lv.${i+1}</span></div>`).join('')}</div><div class="caption">面積 = 記録日数</div>`],
['3帯への集約','不調・通常・好調の3分類で、より素早く読ませる。',`<div class="three"><span style="background:linear-gradient(90deg,#ef4444,#f97316)">不調 10日</span><span class="c3">通常 9日</span><span style="background:linear-gradient(90deg,#22c55e,#3b82f6)">好調 11日</span></div><div class="callout">好調が <b>37%</b> で最も多い</div><div style="margin-top:14px">${stack()}</div>`],
['ミニドーナツ＋凡例','円グラフを小さく抑え、読み取りは凡例に任せる。',`<div class="split"><div class="ringbox"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="none" stroke="#ef4444" stroke-width="13" stroke-dasharray="29 197" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="36" fill="none" stroke="#f97316" stroke-width="13" stroke-dasharray="45 181" stroke-dashoffset="-31" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="36" fill="none" stroke="#94a3b8" stroke-width="13" stroke-dasharray="68 158" stroke-dashoffset="-78" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="36" fill="none" stroke="#22c55e" stroke-width="13" stroke-dasharray="52 174" stroke-dashoffset="-148" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="36" fill="none" stroke="#3b82f6" stroke-width="13" stroke-dasharray="32 194" stroke-dashoffset="-202" transform="rotate(-90 50 50)"/></svg><div class="ringcenter"><b>3.1</b><span>平均</span></div></div><div class="list" style="flex:1">${C.map((c,i)=>`<div><span><i class="${c}" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px"></i>Lv.${i+1}</span><b>${N[i]}日</b></div>`).join('')}</div></div>`],
['縦積み棒','幅を取らず、モバイルで日数の構成比を見せる。',`<div class="center" style="height:72px;gap:16px"><div style="height:68px;width:28px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column-reverse">${C.map((c,i)=>`<span class="${c}" style="height:${P[i]}%"></span>`).join('')}</div><div class="small" style="line-height:1.8">全記録 <b style="font-size:18px;color:#475569">30</b> 日<br>中央値 <b>Lv.3</b><br>平均 <b>3.1</b></div></div>${legend()}`],
['100%帯＋要約','割合の帯を主役にし、説明テキストを結論だけに絞る。',`${stack()}<div class="kpi" style="margin-top:12px"><div><span class="muted">最多のコンディション</span><br><strong>Lv.3</strong></div><div style="text-align:right"><span class="muted">該当日数</span><br><strong>9日</strong></div></div>`],
['段階的な横棒','5本のバーの長さを階段状に並べ、レベルの流れを感じさせる。',`<div style="display:flex;align-items:end;gap:5px;height:69px">${C.map((c,i)=>`<div style="flex:1;text-align:center"><div class="${c}" style="height:${N[i]*6}px;border-radius:4px 4px 0 0"></div><small class="muted">Lv.${i+1}</small></div>`).join('')}</div><div class="callout"><b>Lv.3</b> を中心に分布</div>`],
['カレンダー連想のマス','日ごとの記録という性質を、カレンダー的な正方形で表現。',`${dots(true)}<div class="barlabels"><span>4日</span><span>6日</span><span>9日</span><span>7日</span><span>4日</span></div><div style="margin-top:7px">${stack()}</div>`],
['中央値を基準にした差','「普通」を基準線として見せ、上下の偏りを明快にする。',`<div style="position:relative;height:67px"><div style="position:absolute;left:0;right:0;top:34px;border-top:1px dashed #94a3b8"></div><span class="muted" style="position:absolute;right:0;top:24px">基準 Lv.3</span><div class="area" style="height:67px">${C.map((c,i)=>`<span class="${c}" style="height:${N[i]*5}px;align-self:${i<2?'end':i===2?'center':'start'}"></span>`).join('')}</div></div>`],
['好調／不調の対比','両端の結果をまず比較し、標準は背景に退かせる。',`<div class="split" style="gap:6px"><div style="flex:1;border-radius:10px;background:#fff0ee;padding:10px;text-align:center"><span class="small">不調日</span><br><b class="big" style="color:#e05242">10</b><span class="small"> 日</span></div><div style="flex:1;border-radius:10px;background:#edf9f1;padding:10px;text-align:center"><span class="small">好調日</span><br><b class="big" style="color:#1c9a54">11</b><span class="small"> 日</span></div></div><div class="callout">通常 <b>9日</b> ／ 好調が1日多い</div>`],
['5分割インジケーター','小さなスペースで、各段階の量だけを端的に伝える。',`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px">${C.map((c,i)=>`<div style="text-align:center"><div class="${c}" style="height:${24+N[i]*3}px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px">${N[i]}</div><span class="muted">Lv.${i+1}</span></div>`).join('')}</div><div class="caption">日数</div>`],
['横棒＋平均ポインタ','棒の比率を見せながら、平均値の位置を重ねる。',`<div class="scale"><div class="pointer">3.1</div>${stack()}</div><div class="divider"></div><div class="kpi"><span class="small">先月平均 2.8</span><span class="badge up">↗ +0.3</span></div>`],
['ランキング・チップ','最多から順に並べる。日数を比較するタスクに特化。',`<div class="rank"><div><b>9</b><small>Lv.3</small></div><div><b>7</b><small>Lv.4</small></div><div><b>6</b><small>Lv.2</small></div><div><b>4</b><small>Lv.1 / 5</small></div></div><div style="margin-top:12px">${stack()}</div>`],
['均衡度メーター','中央値からどの程度広がった分布かを補助指標で示す。',`<div class="split"><div class="tile"><b class="big">3.1</b><span class="muted">平均</span></div><div style="flex:1"><span class="small">バランス</span><div class="track" style="height:12px;margin:5px 0"><div class="fill c4" style="width:74%"></div></div><b style="font-size:13px;color:#475569">おおむね安定</b><br><span class="muted">標準帯 9日</span></div></div>`],
['レベル別リスト','最も説明的でアクセシブル。数値を確実に伝える。',`${rows()}<div class="divider"></div><div class="kpi"><span class="small">合計</span><b style="font-size:13px">30日</b></div>`],
['上下の積み上げ','不調を下、好調を上に配置して標準を中心に据える。',`<div class="center" style="height:70px"><div style="width:50px;height:70px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-radius:8px">${C.map((c,i)=>`<span class="${c}" style="height:${N[i]*4}px"></span>`).join('')}</div><div style="margin-left:10px"><b class="big">3.1</b><br><span class="muted">平均コンディション</span></div></div>`],
['色帯ラベル','5色に日数の数字を直接載せ、凡例を不要にする。',`<div style="display:flex;height:42px;border-radius:8px;overflow:hidden">${C.map((c,i)=>`<span class="${c}" style="width:${P[i]}%;display:grid;place-items:center;color:${i===2?'#344054':'#fff'};font-size:10px;font-weight:850">${N[i]}</span>`).join('')}</div><div class="barlabels"><span>Lv.1</span><span>Lv.2</span><span>Lv.3</span><span>Lv.4</span><span>Lv.5</span></div>`],
['ミニヒートマップ','月間の記録量を色の集合として扱う、視覚優先の案。',`<div class="heat">${C.flatMap((c,i)=>Array(N[i]).fill(`<i class="${c}"></i>`)).join('')}</div><div class="divider"></div><div class="kpi"><span class="small">記録日数</span><b style="font-size:13px">30 / 30日</b></div>`],
['平均＋前月比較','分布より月次の変化を主役にするサマリー案。',`<div class="kpi"><div><span class="muted">今月平均</span><br><strong>3.1</strong></div><div style="text-align:right"><span class="muted">前月比</span><br><span class="badge up">↗ +11%</span></div></div><div style="margin-top:10px">${stack()}</div>${legend()}`],
['コンパクト結論型','最小限の高さで、平均・最多・分布をすべて置く。',`<div class="split"><div><b class="big">3.1</b><br><span class="muted">今月平均</span></div><div style="flex:1">${stack()}<div class="barlabels"><span>不調 10日</span><b>最多 Lv.3</b><span>好調 11日</span></div></div></div><div class="callout">全 <b>30日</b> のコンディション記録</div>`],
['月次レポート型','数値の説明を優先した、レポート・一覧画面向けの案。',`<div class="list">${C.map((c,i)=>`<div><span><i class="${c}" style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px"></i>コンディション Lv.${i+1}</span><span><b>${N[i]}日</b>　${P[i]}%</span></div>`).join('')}</div><div style="margin-top:10px">${stack()}</div>`],
['日数主役の大字型','最も知りたい日数を大きく表示し、割合は補助情報に下げる。',`<div class="split"><div class="tile" style="min-width:85px"><b class="big">30</b><span class="muted">記録日数</span></div><div style="flex:1">${rows()}</div></div>`],
['数値付き横積み棒','区画の中に日数を直接表示。凡例を見ずに日数を拾える。',`<div style="display:flex;height:34px;border-radius:8px;overflow:hidden">${C.map((c,i)=>`<span class="${c}" style="width:${P[i]}%;display:grid;place-items:center;color:${i===2?'#344054':'#fff'};font-weight:850;font-size:10px">${N[i]}日</span>`).join('')}</div><div class="barlabels"><span>Lv.1</span><span>Lv.2</span><span>Lv.3</span><span>Lv.4</span><span>Lv.5</span></div>`],
