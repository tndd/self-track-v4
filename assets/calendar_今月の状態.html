</style></head><body><header><h1>「今月の状態」— 完成版 v14</h1><p>参考画像の距離感に合わせ、通常の「▲」を小さくし、棒から少しだけ離して配置した完成版です。数値と説明は近い構成を採用しています。</p></header><main class="grid" id="app"></main><script>
const C=['#f44343','#ff7618','#92a1b5','#1fc45d','#3e7ff0'],D=[4,6,9,7,4],P=[13,20,30,23,14];
const counts=()=>`<div class="counts">${D.map((d,i)=>`<div class="count"><i style="background:${C[i]}"></i><b>${d}日</b>${P[i]}%</div>`).join('')}</div>`;
const base=(style)=>`<div class="card"><span class="chip"><i class="dot"></i>今月の状態</span><div class="top"><div><div class="eyebrow">今月の平均</div><div class="avg">3.1</div></div><div class="rank"><small>今日の状態</small><b><i>↑</i>上位 32%</b></div></div><div class="zone"><div class="scale"><i class="r"></i><i class="o"></i><i class="g"></i><i class="gr"></i><i class="b"></i></div><div class="mark ${style}"><span class="tri">▲</span><span class="score">3.4</span><span class="sub">今日の平均</span></div><div class="words"><span>低い</span><span>良い</span></div></div>${counts()}</div>`;
const V=[
['完成版','小さめの▲を棒から8px離し、数値「3.4」と「今日の平均」を近く配置した最終案。','scoreFirst softLabel compact']
];
document.getElementById('app').innerHTML=V.map((v,i)=>`<section class="case"><h2><span>${i+1}</span>${v[0]}</h2><p class="note">${v[1]}</p>${base(v[2])}</section>`).join('');
</script></body></html>
