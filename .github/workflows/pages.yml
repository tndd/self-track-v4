name: self-track-v4 のテストとデプロイ

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 検証
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
      - name: Node.js を準備
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: Pages 全体をビルド
        run: npm run build:pages

  deploy:
    name: GitHub Pages へデプロイ
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
      - name: Node.js を準備
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund
      - name: Pages 全体をビルド
        run: npm run build:pages
      - name: Pages を設定
        uses: actions/configure-pages@v5
      - name: Pages 成果物をアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
