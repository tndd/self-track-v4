<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>self-track-v4 phase-1 mock</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--muted:#667085;--text:#172033;--border:#dfe5ef;--red:#ef4444;--orange:#f97316;--gray:#94a3b8;--green:#22c55e;--blue:#3b82f6;--r:18px;--s:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:92px}.bar{display:flex;align-items:flex-start;gap:10px;padding:18px}.menu{border:0;background:transparent;font-size:22px}.title{font-size:24px;font-weight:800;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted)}.page{padding:0 18px}.timeline{display:grid;gap:16px}.row{display:grid;grid-template-columns:48px 1fr;gap:10px}.time{font-size:11px;color:var(--muted);padding-top:6px}.body{border-left:2px solid var(--border);padding-left:12px}.status{display:flex;align-items:center;gap:7px;font-weight:700}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff}.s1{background:var(--red)}.s2{background:var(--orange)}.s3{background:var(--gray);color:var(--text)}.s4{background:var(--green)}.s5{background:var(--blue)}.chip{display:inline-flex;border-radius:999px;background:#eef2ff;color:#3446a8;padding:5px 9px;font-size:11px;margin:5px 3px 0 0;border:0}.comment{font-size:13px;margin:6px 0 0;color:#344054}.dock{position:fixed;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,var(--bg) 28%)}.composer{max-width:460px;margin:auto;border:1px solid var(--border);background:var(--surface);border-radius:22px;padding:7px;box-shadow:0 12px 34px #10182820}.composeRow{display:flex;gap:7px;align-items:center}.round{width:36px;height:36px;border:0;border-radius:50%;background:#eef2f7}.input{flex:1;border:0;background:transparent;padding:8px}.panel{border-bottom:1px solid var(--border);padding:8px 6px 12px;margin-bottom:6px}.panelHead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px}.pillBtn{border:0;border-radius:999px;background:var(--text);color:#fff;padding:7px 10px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.score{border:1px solid var(--border);background:#fff;border-radius:14px;padding:6px 2px;font-size:10px}.score .dot{margin:auto auto 4px}.selected{outline:2px solid var(--text)}.tagArea{max-height:130px;overflow:auto;margin-bottom:10px}.group{font-size:11px;color:var(--muted);font-weight:700;margin:8px 0 2px}.drawerShade{position:fixed;inset:0;background:#0f172a1a;display:none}.drawer{position:fixed;inset:0 auto 0 0;width:min(80vw,280px);background:#fff;padding:22px;display:none}.drawer a{display:block;padding:12px;text-decoration:none;color:var(--text);border-radius:10px}.drawer a:hover{background:#eef2f7}.note{margin:18px;padding:12px;border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><button id="menu" class="menu">☰</button><div><div class="title">Today</div><div class="sub">8月12日 水曜</div></div></header>
  <main class="page"><div class="timeline" id="timeline">
    <div class="row"><div class="time">16:40</div><div class="body"><div class="status"><span class="dot s4">4</span>良い</div><button class="chip">トラマドール</button><p class="comment">少し復旧。頭の不快感が下がった。</p></div></div>
    <div class="row"><div class="time">15:20</div><div class="body"><div class="status"><span class="dot s1">1</span>最悪</div><button class="chip">倦怠感</button><p class="comment">気分がまるで乗らない。心が痛むよう。</p></div></div>
    <div class="row"><div class="time">09:10</div><div class="body"><div class="status"><span class="dot s3">3</span>普通</div><p class="comment">通常。</p></div></div>
  </div></main>
</div>
<div class="dock"><div class="composer"><div id="panel" class="panel" hidden><div id="tagArea" class="tagArea" hidden><div class="group">薬</div><button class="chip">トラマドール</button><button class="chip">プレガバリン</button><div class="group">症状</div><button class="chip">頭痛</button><button class="chip">倦怠感</button><div class="group">要因</div><button class="chip">睡眠不足</button></div><div class="panelHead"><span>Status</span><button id="tags" class="pillBtn">タグを追加</button></div><div class="scale"><button class="score"><span class="dot s1">1</span>最悪</button><button class="score"><span class="dot s2">2</span>悪い</button><button class="score selected"><span class="dot s3">3</span>普通</button><button class="score"><span class="dot s4">4</span>良い</button><button class="score"><span class="dot s5">5</span>最高</button></div></div><div class="composeRow"><button id="plus" class="round">＋</button><input class="input" placeholder="コメントを書く…"><button class="round">↑</button></div></div></div>
<div id="shade" class="drawerShade"></div><aside id="drawer" class="drawer"><strong>self-track</strong><nav><a href="#">Today</a><a href="#">Calendar</a><a href="#">Analysis</a><a href="#">Tags</a><a href="#">Settings</a></nav><div class="note">Phase 1 mock: visual polish is intentionally deferred. Structure and interaction are the artifact.</div></aside>
<script>
const panel=document.querySelector('#panel'),tagArea=document.querySelector('#tagArea'),plus=document.querySelector('#plus'),tags=document.querySelector('#tags'),menu=document.querySelector('#menu'),shade=document.querySelector('#shade'),drawer=document.querySelector('#drawer');
plus.addEventListener('click',()=>panel.hidden=!panel.hidden);tags.addEventListener('click',()=>{tagArea.hidden=!tagArea.hidden;tags.textContent=tagArea.hidden?'タグを追加':'タグを閉じる'});function setDrawer(open){drawer.style.display=open?'block':'none';shade.style.display=open?'block':'none'}menu.addEventListener('click',()=>setDrawer(true));shade.addEventListener('click',()=>setDrawer(false));document.querySelectorAll('.score').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.score').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')}));document.querySelectorAll('.tagArea .chip').forEach(x=>x.addEventListener('click',()=>x.classList.toggle('selected')));
</script>
</body></html>
